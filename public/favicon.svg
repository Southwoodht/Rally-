<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Southwood">
  <!--
    Southwood favicon — the same S, optically sized for 16 and 32 pixels.
    icon.svg's letter scaled 1.3 about its own centre (472, 512), with NO
    BALL: at 16px it is under two pixels, and at 32 a gold dot in the corner
    of a browser tab reads as an unread badge. The path is byte-identical to
    icon.svg's; only the transform differs.
  -->
  <defs>
    <linearGradient id="sw-field-favicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3529"/>
      <stop offset="1" stop-color="#12211A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sw-field-favicon)"/>

  <g transform="translate(512 512) scale(1.3) translate(-472 -512)"
     fill="none" stroke="#F4EFE3" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
    <path d="M608 296Q586 257 536 257H424A127.5 127.5 0 0 0 424 512H520A127.5 127.5 0 0 1 520 767H408Q358 767 336 728"/>
  </g>
</svg>
