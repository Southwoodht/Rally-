<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rally">
  <!--
    Rally favicon — the same mark, optically sized for 16 and 32 pixels.

    Nothing is redrawn: it is icon.svg's letter scaled 1.30 about its own
    optical centre, so the mark fills 76% of the tile instead of 59%. A
    favicon has no room to spend on margin — the generous margin that makes
    the app icon look professional at 180px is thrown-away pixels at 16.

    This is a much smaller correction than it used to be. The first version of
    the icon had an elliptical bowl and a 128 stroke, and at 16px its counter
    was 1.7 physical pixels and closed completely — the letter became a lime
    blob, and the favicon needed its own geometry to survive. The stadium bowl
    and the 92 stroke fixed that at the source: the app icon now holds its
    counter at 16px on its own. This file is the last few percent, not a
    rescue.

    Tested magnified at 16 / 32 / 48, which is the only way to see it.
  -->
  <defs>
    <linearGradient id="rally-field-favicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#255140"/>
      <stop offset="1" stop-color="#0E241D"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#rally-field-favicon)"/>

  <g transform="translate(492 512) scale(1.3) translate(-492 -512)"
     fill="none" stroke="#D9E84B" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 257V767"/>
    <path d="M322 257H529A133 133 0 0 1 529 523H322"/>
    <path d="M412 523L646 767"/>
  </g>
</svg>
