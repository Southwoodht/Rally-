<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Southwood">
  <!--
    Southwood app icon, maskable variant — for Android adaptive icons.
    Identical to icon.svg except the mark is scaled 0.736 (0.92 x 0.8) about
    the composition's optical centre, so it sits inside the circle every
    Android mask guarantees. The ball is the rightmost part and the part a
    circular mask reaches first. The field is full-bleed and unscaled —
    it is the part the crop is supposed to eat.

    Declared in manifest.json with "purpose": "maskable" only.
  -->
  <defs>
    <linearGradient id="sw-field-maskable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3529"/>
      <stop offset="1" stop-color="#12211A"/>
    </linearGradient>
    <clipPath id="sw-ball-clip-maskable">
      <circle cx="818" cy="703" r="108"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sw-field-maskable)"/>

  <g transform="translate(502 512) scale(0.736) translate(-588 -512)">
    <g fill="none" stroke="#F4EFE3" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
      <path d="M608 296Q586 257 536 257H424A127.5 127.5 0 0 0 424 512H520A127.5 127.5 0 0 1 520 767H408Q358 767 336 728"/>
    </g>
    <circle cx="818" cy="703" r="108" fill="#E9C46A"/>
    <g clip-path="url(#sw-ball-clip-maskable)" fill="none" stroke="#16271F" stroke-width="15" stroke-linecap="round">
      <path d="M715.4 669.5Q772.6 657.6 784.5 600.4"/>
      <path d="M920.6 736.5Q863.4 748.4 851.5 805.6"/>
    </g>
  </g>
</svg>
