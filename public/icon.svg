<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Southwood">
  <!--
    Southwood app icon — the master. Every PNG in public/ is rendered from
    this file (scripts/build-icons.md).

    THE S IS FRAUNCES 600's OWN "S", its outline copied into this file, not
    drawn. Sam, 2026-09-27, after two hand-drawn monoline S's: he wanted it
    "more like" the serif greetings on the Paris and SW19 themes. Four were
    compared side by side (Fraunces 600, Fraunces 700, Fraunces at its 144
    optical size, Cormorant Garamond 700) and he chose this one. Fraunces is
    the Paris theme's display face and is under the SIL Open Font Licence,
    which permits using its outlines in a logo.

    Being an outline it is FILLED, not stroked, so there is no stroke width
    to keep in step across the masters — the path data is the letter. Cap
    height 560 on the 1024 tile, vertically centred; the ball (r 108, gold,
    seams clipped to the circle) sits on the letter's baseline 34 units to
    its right, and letter plus ball are centred on x 506 — a touch right of
    the tile centre, because the ball throws weight right less than the
    serifs throw it left.

    Regenerate rather than edit by hand: the outline came from opentype.js
    reading the font file, scaled so the glyph's bounding box is 560 tall.
    No rounded corners — iOS and Android apply their own mask.
  -->
  <defs>
    <linearGradient id="sw-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3529"/>
      <stop offset="1" stop-color="#12211A"/>
    </linearGradient>
    <clipPath id="sw-ball"><circle cx="721.2" cy="684.0" r="108"/></clipPath>
  </defs>
