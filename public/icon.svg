<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rally">
  <!--
    Rally app icon — the master. Every PNG in public/ is rendered from this
    file by scripts/build-icons.md's procedure, so the mark can be re-exported
    without being redrawn.

    THE R IS STROKED, NOT SET. It is three strokes at one weight — stem, bowl,
    leg — with round caps and joins, deliberately wider and rounder than the
    RALLY wordmark's condensed cut, because a narrow letter leaves dead air in
    a square tile.

    Geometry, all on the 1024 master and all on the stroke CENTRE lines:

      stroke      128        12.5% of the tile
      stem        x 332, y 262 -> 762
      bowl        half-ellipse rx 235 ry 130, closing back on the stem at 522
      leg         from that junction out to x 652 at the baseline
      counter     107 wide x 132 tall, so it survives being shrunk

    Adding the 64px cap radius at every extreme, the drawn mark measures
    448 x 628 — 44% of the tile wide and 61% tall.

    **That is 44% wide where the brief said 55%, and it is not a slip.** An R
    is taller than it is wide, so the two numbers cannot both be had: forcing
    the bounding box to 55% of the tile at a sane height gives a bowl 2.5
    times wider than it is tall — a squashed loop — and keeping the bowl round
    while hitting 55% wide needs a letter 780px tall, which is 76% of the tile
    and eats the margin the brief asks for in the very next line. So the mark
    is ~55-60% of the tile in its LARGEST dimension and the width falls where
    the letterform wants it. Margins: 198 top and bottom, 268 left, 308 right.

    Optically centred, not measured. The leg throws weight to the right, so
    the bounding box sits at x 492 — 2% left of true centre — which is what
    makes it read as centred.

    The field gradient is deliberately almost invisible. It is there to stop
    the tile reading as a flat swatch, not to be seen as a gradient.

    NO ROUNDED CORNERS, ON PURPOSE. iOS and Android apply their own mask; a
    pre-rounded icon gets rounded twice and shows a pale seam at each corner.
  -->
  <defs>
    <linearGradient id="rally-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#255140"/>
      <stop offset="1" stop-color="#0E241D"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#rally-field)"/>

  <g fill="none" stroke="#D9E84B" stroke-width="128" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 262V762"/>
    <path d="M332 262a235 130 0 0 1 0 260L652 762"/>
  </g>
</svg>
