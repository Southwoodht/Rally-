<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Southwood">
  <!--
    Southwood app icon — the master. Every PNG in public/ is rendered from
    this file (scripts/build-icons.md), so the mark can be re-exported
    without being redrawn.

    REDRAWN 2026-09-27 from the R to an S, when the app stopped being called
    Rally (the name was taken several times over, the LTA's booking service
    among them). Everything but the letter is the R's: cream #F4EFE3 on the
    #16271F field, a gold #E9C46A ball, the same 92 stroke with round caps,
    the same 0.92 scale onto the same optical centre.

    THE S IS ONE STROKE BUILT FROM TWO STADIUMS, the R's bowl turned into a
    letter: top run, semicircle (r 127.5) down the left, a flat spine at
    y 512, semicircle down the right, bottom run. Flat runs rather than a
    classic swash, so it is visibly the same family as the R it replaces and
    its counters stay open at 16px. The terminals turn in on a short curve
    rather than stopping flat, which is what makes it an S and not a 5.

    Geometry on the 1024 master, stroke centre lines:
      top bowl    centre (424, 384.5), bottom bowl centre (520, 639.5)
      spans       x 296..648, y 257..767 — the R's height exactly
      ball        centre (818, 703) r 108, 24 units clear of the lower bowl
                  at the closest point. At 11 it read as touching at 300px,
                  which at 48px would read as one blob.

    Mark plus ball spans x 250..926, centre 588, and that is the centre the
    transform moves onto (502, 512).

    The ball's seams are clipped to the circle so their round caps cannot
    give it horns. No rounded corners: iOS and Android apply their own mask.
  -->
  <defs>
    <linearGradient id="sw-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3529"/>
      <stop offset="1" stop-color="#12211A"/>
    </linearGradient>
    <clipPath id="sw-ball-clip">
      <circle cx="818" cy="703" r="108"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sw-field)"/>

  <g transform="translate(502 512) scale(0.92) translate(-588 -512)">
    <g fill="none" stroke="#F4EFE3" stroke-width="92" stroke-linecap="round" stroke-linejoin="round">
      <path d="M608 296Q586 257 536 257H424A127.5 127.5 0 0 0 424 512H520A127.5 127.5 0 0 1 520 767H408Q358 767 336 728"/>
    </g>
    <circle cx="818" cy="703" r="108" fill="#E9C46A"/>
    <g clip-path="url(#sw-ball-clip)" fill="none" stroke="#16271F" stroke-width="15" stroke-linecap="round">
      <path d="M715.4 669.5Q772.6 657.6 784.5 600.4"/>
      <path d="M920.6 736.5Q863.4 748.4 851.5 805.6"/>
    </g>
  </g>
</svg>
